<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HireFlow Job Hub" />
    <meta property="og:description" content="Explore current job openings and career opportunities with HireFlow Job Hub." />
    <meta property="og:url" content="https://hireflow-job-hub.vercel.app" />
    <meta name="theme-color" content="#2563eb" />
    <script>
      try {
        const savedTheme = localStorage.getItem("hireflow-theme");
        const isDark = savedTheme
          ? savedTheme === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
      } catch {
        // The app applies the system preference after it starts.
      }
    </script>
    <meta
      name="description"
      content="Explore jobs and companies with HireFlow Job Hub, a job-search platform."
    />
    <link rel="canonical" href="https://hireflow-job-hub.vercel.app" />
    <title>HireFlow Job Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
